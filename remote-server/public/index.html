<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070d18" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SEEKER" />
    <meta name="robots" content="noindex, nofollow" />
    <title>SEEKER Remote</title>
    <link rel="manifest" href="/app.webmanifest" />
    <link rel="icon" href="/icon-64.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="app">
      <main id="view"></main>
      <footer id="composer" hidden>
        <div class="composer-top">
          <button id="stop" class="btn-stop" type="button" hidden><span class="square"></span>Stop</button>
          <span id="context" class="muted"></span>
        </div>
        <form id="form" class="composer-box">
          <button id="commands" class="plus" type="button" aria-label="Commands">+</button>
          <textarea id="input" rows="1" placeholder="Ask Seeker…" autocomplete="off" autocapitalize="sentences"></textarea>
          <button id="send" class="send" type="submit" aria-label="Send"></button>
        </form>
        <div class="composer-foot muted"><span>/ commands</span><span id="tokens"></span></div>
      </footer>
      <nav id="nav" hidden></nav>
    </div>
    <div id="sheet" hidden></div>
    <div id="toast" hidden></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
