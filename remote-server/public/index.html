<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0D10" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SEEKER" />
    <meta name="robots" content="noindex, nofollow" />
    <title>SEEKER Remote</title>
    <link rel="manifest" href="/app.webmanifest" />
    <link rel="icon" href="/icon-64.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="app">
      <!-- A session's title, state and tabs: above the scrolling area, never inside it. -->
      <header id="top" class="session-top" hidden></header>
      <main id="view"></main>
      <footer id="composer" hidden>
        <div id="fabs" class="fabs">
          <button id="fab-latest" class="fab" type="button" aria-label="Jump to the latest message" hidden></button>
        </div>
        <div id="status" class="run-status" role="status" hidden></div>
        <div id="queue" class="queue-panel" aria-label="Queued instructions" hidden></div>
        <div id="controls" class="controls" hidden></div>
        <div id="suggest" class="suggest" hidden></div>
        <div id="attachments" class="attachments" hidden></div>
        <!-- At rest one line: +, the writing area, Send. While writing (or with something in it) two levels:
             the writing area has a row to itself; +, the context used, Stop and Send sit under it.
             + opens one sheet with everything that can be added: camera, photos, any file, a file mention, commands.
             "anyfile" names every kind except image and video: iOS shows its Photo Library / Take Photo / Choose Files
             menu for any picker that could take a picture, and Files should open the file browser straight away
             (pictures have their own two rows). -->
        <form id="form" class="composer-box">
          <textarea id="input" rows="1" placeholder="Message or command…" autocomplete="off" autocapitalize="sentences" aria-label="Message to Seeker"></textarea>
          <div class="composer-bar" role="toolbar" aria-label="Message tools">
            <button id="add" class="tool-btn" type="button" aria-label="Add to message: camera, photos, files, commands" aria-haspopup="dialog"></button>
            <input id="camera" type="file" accept="image/*" capture="environment" hidden />
            <input id="file" type="file" accept="image/*,video/*" multiple hidden />
            <input id="anyfile" type="file" accept="application/*,text/*,audio/*,font/*,model/*" multiple hidden />
            <span class="grow extra"></span>
            <span id="tokens" class="tokens extra" aria-label="Context used"></span>
            <button id="stop" class="stop-btn" type="button" aria-label="Stop current execution" title="Stop current execution" hidden></button>
            <button id="send" class="send" type="submit" aria-label="Send instruction" title="Send"></button>
          </div>
        </form>
      </footer>
      <nav id="nav" hidden></nav>
    </div>
    <div id="sheet" hidden></div>
    <div id="toast" role="status" hidden></div>
    <div id="announce" class="sr-only" aria-live="polite"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
