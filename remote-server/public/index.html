<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#060d19" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SEEKER" />
    <meta name="robots" content="noindex, nofollow" />
    <title>SEEKER Remote</title>
    <link rel="manifest" href="/app.webmanifest" />
    <link rel="icon" href="/icon-64.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="app">
      <button id="fab-back" class="fab" type="button" aria-label="Back to projects" hidden></button>
      <main id="view"></main>
      <footer id="composer" hidden>
        <div id="fabs" class="fabs">
          <button id="fab-latest" class="fab" type="button" aria-label="Jump to the latest message" hidden></button>
        </div>
        <div id="controls" class="controls" hidden></div>
        <div id="suggest" class="suggest" hidden></div>
        <div id="attachments" class="attachments" hidden></div>
        <form id="form" class="composer-box">
          <button id="commands" class="tool-btn" type="button" aria-label="Commands and earlier messages"></button>
          <button id="attach" class="tool-btn" type="button" aria-label="Attach an image"></button>
          <input id="file" type="file" accept="image/*" multiple hidden />
          <textarea id="input" rows="1" placeholder="Message or /command…" autocomplete="off" autocapitalize="sentences" aria-label="Message to Seeker"></textarea>
          <button id="send" class="send" type="submit" aria-label="Send"></button>
        </form>
        <div class="composer-foot"><span>/ commands · images</span><span id="tokens" aria-label="Context used"></span></div>
      </footer>
      <nav id="nav" hidden></nav>
    </div>
    <div id="sheet" hidden></div>
    <div id="toast" role="status" hidden></div>
    <div id="announce" class="sr-only" aria-live="polite"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
