<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0D10" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SEEKER" />
    <meta name="robots" content="noindex, nofollow" />
    <title>SEEKER Remote</title>
    <link rel="manifest" href="/app.webmanifest" />
    <link rel="icon" href="/icon-64.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="app">
      <!-- A session's title, state and tabs: above the scrolling area, never inside it. -->
      <header id="top" class="session-top" hidden></header>
      <main id="view"></main>
      <footer id="composer" hidden>
        <div id="fabs" class="fabs">
          <button id="fab-latest" class="fab" type="button" aria-label="Jump to the latest message" hidden></button>
        </div>
        <div id="status" class="run-status" role="status" hidden></div>
        <div id="queue" class="queue-panel" aria-label="Queued instructions" hidden></div>
        <div id="controls" class="controls" hidden></div>
        <div id="suggest" class="suggest" hidden></div>
        <div id="attachments" class="attachments" hidden></div>
        <!-- At rest one line: +, the writing area, Send. While writing (or with something in it) two levels:
             the writing area has a row to itself; +, the context used, Stop and Send sit under it.
             + opens one sheet with everything that can be added: camera, photos, any file, a file mention, commands.
             "anyfile" takes every kind; on iOS app.js narrows it so Files opens the file browser straight away. -->
        <form id="form" class="composer-box">
          <textarea id="input" rows="1" placeholder="Message or command…" autocomplete="off" autocapitalize="sentences" aria-label="Message to Seeker"></textarea>
          <div class="composer-bar" role="toolbar" aria-label="Message tools">
            <button id="add" class="tool-btn" type="button" aria-label="Add to message: camera, photos, files, commands" aria-haspopup="dialog"></button>
            <input id="camera" type="file" accept="image/*" capture="environment" hidden />
            <input id="file" type="file" accept="image/*,video/*" multiple hidden />
            <input id="anyfile" type="file" multiple hidden />
            <span class="grow extra"></span>
            <span id="tokens" class="tokens extra" aria-label="Context used"></span>
            <button id="talkmode" class="tool-btn talk-btn" type="button" aria-label="Talk it through: a spoken conversation, nothing is changed until you tap Run" title="Talk mode" hidden></button>
            <button id="mic" class="send mic" type="button" aria-label="Record a voice note" title="Voice note" hidden></button>
            <button id="stop" class="stop-btn" type="button" aria-label="Stop current execution" title="Stop current execution" hidden></button>
            <button id="send" class="send" type="submit" aria-label="Send instruction" title="Send"></button>
          </div>
        </form>
      </footer>
      <nav id="nav" hidden></nav>
    </div>
    <div id="sheet" hidden></div>
    <!-- Talking to SEEKER (app.js, "voice notes"): the robot listens, the wave follows the voice, and what was
         said shows under it, while it is spoken (previews from the Mac) and once it is done, to be checked. -->
    <div id="talk" class="talk" role="dialog" aria-modal="true" aria-label="Voice note" hidden>
      <canvas id="talk-rain" class="talk-rain" aria-hidden="true"></canvas>
      <!-- Talk mode (talk in app.js): the project and whether plan mode holds changes back, at the top. -->
      <div id="talk-top" class="talk-top" hidden></div>
      <div id="talk-bot" class="talk-bot" aria-hidden="true"></div>
      <canvas id="talk-wave" class="talk-wave" aria-hidden="true"></canvas>
      <p id="talk-text" class="talk-text"><span id="talk-said" class="sr-only" aria-live="polite"></span><span class="talk-typed" aria-hidden="true"></span><span class="talk-cur" aria-hidden="true">_</span></p>
      <textarea id="talk-edit" class="talk-edit" rows="3" enterkeyhint="send" aria-label="Fix the words of the voice note" hidden></textarea>
      <!-- Talk mode: the reply being read out, the plan to run, or an approval waiting. -->
      <div id="talk-panel" class="talk-panel" hidden></div>
      <div id="talk-gap" class="talk-gap" hidden aria-hidden="true"><div class="lbl"><span>pause</span><span>sends by itself</span></div><div class="track"><i></i></div></div>
      <div id="talk-state" class="talk-state"></div>
      <div id="talk-actions" class="talk-actions"></div>
      <div id="talk-swipe" class="talk-swipe" aria-hidden="true"></div>
    </div>
    <div id="toast" role="status" hidden></div>
    <div id="announce" class="sr-only" aria-live="polite"></div>
    <!-- The app lock (lock.js): Face ID or a 6-digit PIN. While it is up, #app and #sheet are hidden and inert. -->
    <div id="lock" hidden></div>
    <!-- The Jack In gate (jackin.js): covers the app from the first paint until the robot is tapped.
         Under the lock (z-index), so after an unlock the robot is built out of the PIN's dots. If app.js
         never runs, CSS takes it away by itself after a few seconds (style.css, "gate"). -->
    <div id="gate" aria-hidden="true"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
